
name: 'timesheet_analysis'
version: '1.0.0'
config-version: 2


profile: 'default'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"  
clean-targets:         
  - "target"
  - "dbt_packages"


models :
  timesheet_analysis:
    staging :
      +materialized: table
      +schema: capa_staging
    intermediate:
      +materialized: table
      +schema: capa_intermediate
    marts:
      +materialized: table
      +schema: capa_marts
    report:
      +materialized: table
      +schema: capa_report
    

